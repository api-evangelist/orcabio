aid: orcabio
name: Orca Bio
description: Orca Bio is a late-stage biotechnology company, headquartered in Menlo Park, California with
  a cGMP manufacturing facility in Sacramento, developing high-precision allogeneic cell therapies for
  cancer and autoimmune diseases. Its single-cell sorting platform separates donor blood with high purity
  and speed to build proprietary, precisely-defined mixtures of immune and stem cells. Orca Bio's lead
  program TREGZI is a precision-engineered allogeneic T-cell immunotherapy for hematological malignancies,
  alongside investigational programs Orca-T and Orca-Q. As a clinical/therapeutics company it does not
  publish a public developer or API surface; this profile was surfaced as a portfolio company of Felicis
  and enriched with verified company identity and domain-security signals.
